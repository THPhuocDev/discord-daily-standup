name: Daily Standup 9PM Reminder

on:
  schedule:
    # 14:05 UTC = 21:05 tối giờ Việt Nam (né phút :00 để không bị nghẽn runner)
    - cron: '5 14 * * *'
  workflow_dispatch:

jobs:
  run-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -d "discord-daily-standup" ]; then
            cd discord-daily-standup
          fi
          npm ci || npm install

      - name: Run 9PM reminder
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID || '1504851139441459241' }}
          GUILD_ID: ${{ secrets.GUILD_ID || '1504851139005517995' }}
        run: |
          if [ -d "discord-daily-standup" ]; then
            cd discord-daily-standup
          fi
          npm run test-reminder