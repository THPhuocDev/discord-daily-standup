name: CI Typecheck & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    name: Build & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -d "discord-daily-standup" ]; then
            cd discord-daily-standup
          fi
          npm ci || npm install

      - name: Run Typecheck & Build
        run: |
          if [ -d "discord-daily-standup" ]; then
            cd discord-daily-standup
          fi
          npm run build

      - name: Alert failure to Discord
        if: failure()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MONITORING_CHANNEL_ID: ${{ secrets.MONITORING_CHANNEL_ID || '1564279015693615134' }}
        run: |
          curl -s -X POST "https://discord.com/api/v10/channels/${MONITORING_CHANNEL_ID}/messages" \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"🚨 **[CẢNH BÁO HỆ THỐNG CI]** Workflow \`${{ github.workflow }}\` vừa bị lỗi! Vui lòng kiểm tra log tại: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
