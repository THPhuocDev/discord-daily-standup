name: Daily Standup Trigger

on:
  schedule:
    # 17:05 UTC = 00:05 đêm giờ Việt Nam (Lịch chính - né phút :00 để chạy ngay tức khắc không bị nghẽn)
    - cron: '5 17 * * *'
    # 17:30 UTC = 00:30 đêm giờ Việt Nam (Lịch dự phòng 1)
    - cron: '30 17 * * *'
    # 18:05 UTC = 01:05 sáng giờ Việt Nam (Lịch dự phòng 2)
    - cron: '5 18 * * *'
    # 01:05 UTC = 08:05 sáng giờ Việt Nam (Lưới cứu hộ buổi sáng 1)
    - cron: '5 1 * * *'
    # 01:35 UTC = 08:35 sáng giờ Việt Nam (Lưới cứu hộ buổi sáng 2)
    - cron: '35 1 * * *'
  # Cho phép bấm nút "Run workflow" để test ngay lập tức trên GitHub
  workflow_dispatch:

jobs:
  run-standup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -d "discord-daily-standup" ]; then
            cd discord-daily-standup
          fi
          npm ci || npm install

      - name: Run daily standup script
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID || '1504851139441459241' }}
          GUILD_ID: ${{ secrets.GUILD_ID || '1504851139005517995' }}
        run: |
          if [ -d "discord-daily-standup" ]; then
            cd discord-daily-standup
          fi
          npm run test-run

      - name: Alert failure to Discord
        if: failure()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID || '1504851139441459241' }}
        run: |
          curl -s -X POST "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages" \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"🚨 **[CẢNH BÁO HỆ THỐNG BOT]** Workflow \`${{ github.workflow }}\` vừa bị lỗi! Vui lòng kiểm tra log tại: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"


